<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Kissing Circles</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22cc;
        --edge: #30363d;
        --text: #c9d1d9;
        --dim: #8b949e;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #view:active { cursor: grabbing; }

      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        backdrop-filter: blur(12px);
        padding: 10px 12px;
      }

      #controls {
        top: 12px;
        left: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      #controls label {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--dim);
        white-space: nowrap;
      }

      select {
        background: #0d1117;
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 3px 6px;
        font: inherit;
      }

      #hud {
        bottom: 12px;
        left: 12px;
        right: 12px;
        color: var(--dim);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      #help {
        top: 12px;
        right: 12px;
        color: var(--dim);
        max-width: 220px;
      }
      #help b { color: var(--text); font-weight: 600; }
      #help kbd {
        font-family: ui-monospace, Menlo, monospace;
        background: #0d1117;
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 0 4px;
      }

      @media (max-width: 700px) {
        #help { display: none; }
        #controls { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="controls" class="panel">
      <label>
        packing
        <select id="root">
          <option value="apollonian">(-1, 2, 2, 3)</option>
          <option value="strip">(0, 0, 1, 1) strip</option>
        </select>
      </label>
      <label>
        colour by
        <select id="color">
          <option value="curvature">curvature</option>
          <option value="depth">depth</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="labels" checked />
        curvatures
      </label>
    </div>

    <div id="help" class="panel">
      <b>drag</b> to pan · <b>wheel</b> or <b>pinch</b> to zoom · <b>double-click</b> to
      zoom in<br />
      <kbd>0</kbd> reset · <kbd>+</kbd> <kbd>-</kbd> zoom · <kbd>↑↓←→</kbd> pan ·
      <kbd>l</kbd> labels
    </div>

    <div id="hud" class="panel">starting…</div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
