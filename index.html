<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Kissing Circles</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%238b5cf6' stroke-width='2'/%3E%3Ccircle cx='9' cy='16' r='7' fill='%23a78bfa'/%3E%3Ccircle cx='21' cy='16' r='7' fill='%23a78bfa'/%3E%3Ccircle cx='16' cy='6.5' r='3.2' fill='%23fbbf24'/%3E%3Ccircle cx='16' cy='25.5' r='3.2' fill='%23fbbf24'/%3E%3C/svg%3E"
    />

    <script>
      // Resolve the theme before first paint, so the page never flashes the wrong one.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('kc-theme'); } catch (e) {}
        var mode = saved || 'auto';
        var dark = mode === 'dark' ||
          (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>

    <style>
      /* Caladea: metric-compatible with Cambria, Apache 2.0. See assets/README.md. */
      @font-face {
        font-family: 'Caladea';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./assets/caladea-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Caladea';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./assets/caladea-700.woff2') format('woff2');
      }

      :root {
        --numeral-font: 'Caladea', Cambria, Charter, 'Source Serif 4', Georgia,
          'Times New Roman', serif;
      }

      :root[data-theme='light'] {
        --bg: #eef1f5;
        --panel: #ffffffcc;
        --edge: #d0d7de;
        --text: #1f2328;
        --dim: #57606a;
        --input: #ffffff;
      }

      :root[data-theme='dark'] {
        --bg: #0d1117;
        --panel: #161b22cc;
        --edge: #30363d;
        --text: #c9d1d9;
        --dim: #8b949e;
        --input: #0d1117;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #view:active { cursor: grabbing; }

      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        backdrop-filter: blur(12px);
        padding: 10px 12px;
      }

      #controls {
        top: 12px;
        left: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }

      #controls label {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--dim);
        white-space: nowrap;
      }

      select,
      input[type='text'] {
        background: var(--input);
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 3px 6px;
        font: inherit;
      }

      input[type='text'] {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }

      #error {
        flex-basis: 100%;
        color: #f85149;
        font-size: 12px;
      }
      #error:empty { display: none; }

      #depth-readout {
        color: var(--dim);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
      }

      /* The hover readout: exact values for the circle under the cursor. */
      #readout {
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        min-width: 210px;
        max-width: 300px;
      }
      #readout[hidden] { display: none; }
      #readout table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      #readout th {
        text-align: left;
        font-weight: 400;
        color: var(--dim);
        padding: 1px 10px 1px 0;
        vertical-align: baseline;
        white-space: nowrap;
      }
      #readout td {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        text-align: right;
        padding: 1px 0;
        word-break: break-all;
      }
      #readout .curvature td {
        font-size: 17px;
        font-family: var(--numeral-font);
        font-weight: 700;
      }

      #hud {
        bottom: 12px;
        left: 12px;
        right: 12px;
        color: var(--dim);
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      #help {
        top: 12px;
        right: 12px;
        color: var(--dim);
        max-width: 230px;
      }
      #help b { color: var(--text); font-weight: 600; }
      #help kbd {
        font-family: ui-monospace, Menlo, monospace;
        background: var(--input);
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 0 4px;
      }

      @media (max-width: 900px) {
        #help { display: none; }
        #controls { font-size: 12px; max-width: calc(100% - 24px); }
        /* The readout becomes a strip along the bottom rather than a side panel. */
        #readout {
          top: auto;
          bottom: 58px;
          left: 12px;
          right: 12px;
          transform: none;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="controls" class="panel">
      <label>
        packing
        <select id="root"></select>
      </label>
      <label>
        custom
        <input id="custom" type="text" size="12" placeholder="-6,11,14,15" />
      </label>
      <label>
        color by
        <select id="color">
          <option value="curvature">curvature</option>
          <option value="depth">depth</option>
        </select>
      </label>
      <label>
        theme
        <select id="theme">
          <option value="auto">auto</option>
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="labels" checked />
        curvatures
      </label>
      <span id="depth-readout">depth all</span>
      <div id="error"></div>
    </div>

    <div id="readout" class="panel" hidden></div>

    <div id="help" class="panel">
      <b>drag</b> to pan · <b>wheel</b> or <b>pinch</b> to zoom · <b>double-click</b> to
      zoom in<br />
      <kbd>0</kbd> reset · <kbd>+</kbd> <kbd>-</kbd> zoom · <kbd>↑↓←→</kbd> pan<br />
      <kbd>[</kbd> <kbd>]</kbd> depth · <kbd>l</kbd> labels · <kbd>c</kbd> color ·
      <kbd>t</kbd> theme · <kbd>space</kbd> pause
    </div>

    <div id="hud" class="panel">starting…</div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
